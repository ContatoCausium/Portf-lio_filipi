    <!-- no dev do Vite o CSS entra pelo JS: o body espera escondido até src/estilo.js (ou 6 s, se algo falhar), e nada
         transiciona do estilo padrão do navegador para o da página -->
    <style>html { background: #0b0909; } html:not(.com-estilo) body { visibility: hidden; animation: mostra 0s 6s forwards; } @keyframes mostra { to { visibility: visible; } } html:not(.assentou) *, html:not(.assentou) ::before, html:not(.assentou) ::after { transition: none !important; }</style>
    <noscript><style>body { visibility: visible !important; animation: none; }</style></noscript>
    <link rel="preload" as="image" href="/img/filipi-perfil.webp" fetchpriority="high" />
    <script>
      // ?reel (ou ?reel=0.75): para gravar a tela com o celular. Baixa só o branco das letras (padrão 0.82, entre 0.5 e
      // 1) e esconde a barra de rolagem; o resto da página fica igual.
      (function () {
        var r = new URLSearchParams(location.search).get('reel');
        if (r === null) return;
        var k = Math.min(1, Math.max(0.5, parseFloat(r) || 0.82));
        document.documentElement.classList.add('reel');
        document.documentElement.style.setProperty('--reel', k);
      })();
    </script>
    <script>
      // "monta": os agentes constroem a página na frente de quem vê. "pronto": a página já abre montada
      // (?pronto na URL ou movimento reduzido). Se o motion não subir em 5 s, a página aparece pronta.
      (function () {
        var r = document.documentElement;
        var pronto = /[?&]pronto\b/.test(location.search) || matchMedia('(prefers-reduced-motion: reduce)').matches;
        r.classList.add('js', pronto ? 'pronto' : 'monta');
        if (matchMedia('(hover: none)').matches) r.classList.add('toque');
        if (!pronto) setTimeout(function () { if (!window.__enxame) { r.classList.remove('monta'); r.classList.add('pronto'); } }, 5000);
      })();
    </script>
